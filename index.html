 document.getElementById("teto").value=M().teto?M().teto.toFixed(2).replace(".",","):"";
}
if(sel) sel.onchange=()=>{est.atual=sel.value;guarda();montaMeses();render()};
function montaHist(){var h=document.getElementById("hist");h.textContent="";h.appendChild(el("span","caps","Histórico · toque para ver os itens"));visiveis().reverse().forEach(k=>{var box=el("div","hm"+(k===est.atual?" atual":"")),l=el("div","hl");l.append(el("span","seta","▶"),el("b",null,nomeMes(k)),el("span","num",brl(totalMes(k))));var x=el("button",null,"✕");x.onclick=e=>{e.stopPropagation();if(visiveis().length<2)return alert("Mantenha pelo menos um mês.");if(confirm("Excluir "+nomeMes(k)+"?")){est.meses[k]={del:true,_ts:Date.now()};normaliza();salvar(k);montaMeses();render()}};l.appendChild(x);var det=el("div","det"),m=est.meses[k];(m.s||[]).forEach(s=>{if(!(s.itens||[]).length)return;det.appendChild(el("div","gp",s.nome));s.itens.forEach(i=>{var li=el("div","li"),v=(+i.qtd||0)*(+i.preco||0);li.append(el("i",null,i.nome),el("span",null,(i.qtd||0)+"un"),el("b",null,v?brl(v):"—"));det.appendChild(li)})});if(k!==est.atual){var ab=el("button","abrir","Abrir esta lista");ab.onclick=e=>{e.stopPropagation();est.atual=k;guarda();montaMeses();render();scrollTo(0,0)};det.appendChild(ab)}l.onclick=()=>box.classList.toggle("aberto");box.append(l,det);h.appendChild(box)})}
function totais(){var t=totalMes(est.atual),te=M().teto||0;document.getElementById("total").textContent=brl(t);var S=document.getElementById("saldo"),R=document.getElementById("rot"),B=document.getElementById("bar"),F=document.getElementById("fill");if(te>0){var r=te-t;R.textContent=r>=0?"Disponível":"Acima do teto";S.textContent=brl(Math.abs(r));B.className="bar"+(r<0?" over":"");F.style.width=Math.min(100,t/te*100)+"%"}else{R.textContent="Teto";S.textContent="não definido";B.className="bar";F.style.width="0"}}
var teto=document.getElementById("teto");teto.oninput=()=>{M().teto=num(teto.value);salvar();totais()};teto.onblur=()=>teto.value=M().teto?M().teto.toFixed(2).replace(".",","):"";
var btnSetor=document.getElementById("side-setor");
var boxSetor=document.getElementById("novo-setor-box");
var inputSetor=document.getElementById("novo-setor-nome");
var confirmarSetor=document.getElementById("confirmar-setor");

function criarNovoSetor(){
 var v=(inputSetor.value||"").trim();
 if(!v){ inputSetor.focus(); return; }
 if(!M().s) M().s=[];
 M().s.push({id:id(),nome:v,itens:[]});
 salvar(est.atual);
 inputSetor.value="";
 boxSetor.style.display="none";
 render();
 setTimeout(function(){
   var secoes=document.querySelectorAll("#lista .setor");
   var alvo=secoes[secoes.length-1];
   if(alvo) alvo.scrollIntoView({behavior:"smooth",block:"start"});
 },50);
}

btnSetor.addEventListener("click",function(){
 var aberto=boxSetor.style.display!=="none";
 boxSetor.style.display=aberto?"none":"block";
 if(!aberto) setTimeout(function(){inputSetor.focus()},0);
});
confirmarSetor.addEventListener("click",criarNovoSetor);
inputSetor.addEventListener("keydown",function(e){
 if(e.key==="Enter"){e.preventDefault();criarNovoSetor();}
});
var ref=null;function status(t,c){var e=document.getElementById("sync");e.textContent=t;e.className="sync "+(c||"")}
function conectar(){try{firebase.initializeApp(CONFIG.firebase);ref=firebase.database().ref("listas/"+CONFIG.codigo+"/meses");status("conectando…");ref.on("value",snap=>{var remoto=snap.val()||{},mudou=false;Object.keys(remoto).forEach(k=>{var r=remoto[k],l=est.meses[k];if(!l||(+r._ts||0)>(+l._ts||0)){est.meses[k]=r;mudou=true}});normaliza();guarda();status("sincronizado","on");if(mudou){montaMeses();render()}},()=>status("sem conexão","erro"))}catch(e){status("só neste aparelho")}}
carregar();normaliza();montaMeses();render();conectar();
})();
</script>
